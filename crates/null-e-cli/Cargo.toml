[package]
name = "null-e-cli"
description = "CLI/TUI for null-e disk cleanup tool"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "null-e"
path = "src/main.rs"

# cargo-binstall: download the prebuilt release binary instead of building from source.
# Asset names are mapped per target triple because the release artifacts use os/arch labels
# (darwin/linux + aarch64/x86_64) rather than full Rust target triples. Tags are `v{version}`.
[package.metadata.binstall]
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/null-e-darwin-aarch64.tar.gz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/null-e-darwin-x86_64.tar.gz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/null-e-linux-x86_64.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/null-e-linux-aarch64.tar.gz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/null-e-linux-x86_64-musl.tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/null-e-windows-x86_64.zip"
pkg-fmt = "zip"

[dependencies]
null-e-core = { workspace = true }

# CLI
clap = { workspace = true }

# TUI
ratatui = { workspace = true }
crossterm = { workspace = true }

# Display
colored = { workspace = true }
indicatif = { workspace = true }
console = { workspace = true }
humansize = { workspace = true }

# Serialization (for JSON output)
serde = { workspace = true }
serde_json = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Utilities
chrono = { workspace = true }
walkdir = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
